services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweed-data:/data

volumes:
  seaweed-data: